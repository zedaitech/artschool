# Railway / Nixpacks build for Laravel 12 + Filament v3 (SQLite demo)
# Railway auto-detects this file. It builds PHP + the Vite frontend, then
# serves the app on Railway's injected $PORT.

providers = ["php", "node"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci",
]

[phases.build]
cmds = [
  "npm run build",
]

# Runs on container start (after Railway has injected env vars).
# Caches are built here (not at build time) so APP_KEY / env are present.
# migrate --force is harmless with the committed seeded SQLite file and keeps
# the schema current if you later point DB_DATABASE at a fresh volume.
[start]
cmd = "php artisan storage:link || true; php artisan migrate --force --no-interaction; php artisan config:cache; php artisan route:cache; php artisan view:cache; php artisan serve --host 0.0.0.0 --port ${PORT:-8080}"
